spring.application.name=test-book-app

# Baza de date implicita: H2 in memorie (pentru dezvoltare si teste)
spring.datasource.url=jdbc:h2:mem:bookdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creeaza tabelele din entitati, apoi data.sql adauga datele initiale
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
